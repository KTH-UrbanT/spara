name: spara-test
services:
  ############################
  #  1) Redis                #
  ############################
  redis:
    image: redis:latest
    container_name: spara-redis-test
    restart: always
    networks:
      - spara_test_network
    ports:
      - "6380:6379"

  ############################
  #  2) PostgreSQL           #
  ############################
  message_store:
    image: postgres:13
    container_name: spara-postgres-test
    restart: always
    networks:
      - spara_test_network
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_store
    volumes:
      - message_store_data:/var/lib/postgresql/data
      - ../shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  ############################
  #  3) Message Service      #
  ############################
  message-service:
    build:
      context: ../message-service
      dockerfile: Dockerfile
    container_name: spara-message-service
    restart: always
    networks:
      - spara_test_network
    depends_on:
      - redis
      - message_store
    ports:
      - "8001:8000"
    env_file:
      - ../message-service/.env

  ############################
  #  4) LLM Service          #
  ############################
  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile
    container_name: spara-llm-service-test
    restart: always
    networks:
      - spara_test_network
    depends_on:
      - redis
    environment:
      REDIS_HOST: spara-redis-test

  ############################
  #  5) Frontend (React)     #
  ############################
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_MS_URL: https://test.sparabot.com
        VITE_MS_SOCKETIO_URL: wss://test.sparabot.com
    container_name: spara-frontend-test
    restart: always
    networks:
      - spara_test_network
    ports:
      - "8808:80"
    depends_on:
      - message-service

volumes:
  message_store_data:

networks:
  spara_test_network:
    external: true
