services:
  ############################
  #  1) Redis                #
  ############################
  redis:
    image: redis:latest
    container_name: spara-redis
    ports:
      - "6379:6379"
  ############################
  #  2) database (postgres)     #
  ############################
  message_store:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_store
    ports:
      - "5432:5432"
    volumes:
      - message_store_data:/var/lib/postgresql/data
      - ../shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql
  ############################
  #  3) Message Service      #
  ############################
  message-service:
    build:
      context: ../message-service
      dockerfile: Dockerfile
    container_name: spara-message-service
    depends_on:
      - redis
      - message_store
    ports:
      - "8000:8000"
    env_file:
      - ../message-service/.env
    environment:
      REDIS_HOST: redis
      DB_HOST: message_store 

  ############################
  #  4) LLM Service          #
  ############################
  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile
    container_name: spara-llm-service
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis


  ############################
  #  5) Frontend (React)     #
  ############################
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: spara-frontend
    ports:
      - "5173:80"
    depends_on:
      - message-service
volumes:
  message_store_data:
