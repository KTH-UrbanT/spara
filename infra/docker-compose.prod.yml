name: spara
services:
  ############################
  #  1) Redis                #
  ############################
  redis:
    image: redis:latest
    container_name: spara-redis
    networks:
      - spara_network
    ports:
      - "6379:6379"

  ############################
  #  2) PostgreSQL           #
  ############################
  message_store:
    image: postgres:13
    container_name: spara-postgres
    networks:
      - spara_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_store
    volumes:
      - message_store_data:/var/lib/postgresql/data
      - ../shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  ############################
  #  3) Message Service      #
  ############################
  message-service:
    build:
      context: ../message-service
      dockerfile: Dockerfile
    container_name: spara-message-service
    networks:
      - spara_network
    depends_on:
      - redis
      - message_store
    ports:
      - "8000:8000"
    env_file:
      - ../message-service/.env

  ############################
  #  4) LLM Service          #
  ############################
  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile
    container_name: spara-llm-service
    networks:
      - spara_network
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis

  ############################
  #  5) Frontend (React)     #
  ############################
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        MS_URL: https://test.sparabot.com:8000
        MS_SOCKETIO_URL: wss://test.sparabot.com:8000
    container_name: spara-frontend
    restart: always
    networks:
      - spara_network
    ports:
      - "8800:80"
    depends_on:
      - message-service

volumes:
  message_store_data:

networks:
  spara_network:
    external: true
