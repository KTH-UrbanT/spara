name: spara
services:
  ############################
  #  1) Redis                #
  ############################
  redis:
    image: redis:latest
    container_name: spara-redis
    restart: always
    networks:
      - spara_network
    ports:
      - "6379:6379"

  ############################
  #  2) PostgreSQL           #
  ############################
  message_store:
    image: postgres:13
    container_name: spara-postgres
    restart: always
    networks:
      - spara_network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_store
    volumes:
      - message_store_data:/var/lib/postgresql/data
    #  - ../shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ############################
  #  2.5) Database Migration #
  ############################
  migration_service:
    image: migration_service:prod
    container_name: spara-alembic-prod
    networks:
      - spara_network
    depends_on:
      message_store:
        condition: service_healthy
    environment:
      - ALEMBIC_DB_URL=postgresql://postgres:postgres@message_store:5432/message_store
    volumes:
      - ../shared/alembic/migrations:/app/migrations
    restart: "no"  # Run once and exit

  ############################
  #  3) Message Service      #
  ############################
  message-service:
    image: message-service:prod
    container_name: spara-message-service
    restart: always
    networks:
      - spara_network
    depends_on:
      - redis
      - message_store
    ports:
      - "8000:8000"
    env_file:
      - ../message-service/.env

  ############################
  #  4) LLM Service          #
  ############################
  llm-service:
    image: llm-service:prod
    container_name: spara-llm-service
    restart: always
    networks:
      - spara_network
    depends_on:
      - redis
    environment:
      REDIS_HOST: spara-redis

  ############################
  #  5) Frontend (React)     #
  ############################
  frontend:
    image: frontend:prod
    container_name: spara-frontend
    restart: always
    networks:
      - spara_network
    ports:
      - "8800:80"
    depends_on:
      - message-service

volumes:
  message_store_data:
    driver: local  # Docker managed volume - will be created automatically
  redis_data:
    driver: local  # Docker managed volume - will be created automatically

networks:
  spara_network:
    external: true
