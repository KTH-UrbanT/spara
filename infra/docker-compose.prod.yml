name: spara

services:
  redis:
    image: redis:latest
    container_name: spara-redis
    restart: always
    networks:
      - spara_network
    ports:
      - "6379:6379"

  message-service:
    build:
      context: ../message-service
      dockerfile: Dockerfile
    container_name: spara-message-service
    restart: always
    networks:
      - spara_network
    depends_on:
      - redis
    ports:
      - "8000:8000"
    env_file:
      - ../message-service/.env

  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile
    container_name: spara-llm-service
    restart: always
    networks:
      - spara_network
    depends_on:
      - redis
    env_file:
      - ../llm-service/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_MS_URL: https://sparabot.com
        VITE_MS_SOCKETIO_URL: wss://sparabot.com
        VITE_DEPLOYMENT_TAG: ${VITE_DEPLOYMENT_TAG:-}
        VITE_BRANCH: ${VITE_BRANCH:-}
    container_name: spara-frontend
    restart: always
    networks:
      - spara_network
    ports:
      - "8800:80"
    depends_on:
      - message-service

networks:
  spara_network:
    external: true