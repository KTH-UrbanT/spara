name: spara-dev
services:
  ############################
  #  1) Redis                #
  ############################
  redis:
    image: redis:latest
    container_name: spara-redis-dev
    ports:
      - "6379:6379"

  ############################
  #  2) PostgreSQL           #
  ############################
  message_store:
    image: postgres:13
    container_name: spara-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_store
    volumes:
      - message_store_data:/var/lib/postgresql/data
      #- ../shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  ############################
  #  2.5) Database Migration #
  ############################
  flyway:
    image: flyway/flyway:9-alpine
    container_name: spara-flyway
    depends_on:
      - message_store
    environment:
      - FLYWAY_URL=jdbc:postgresql://message_store:5432/message_store
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_BASELINE_ON_MIGRATE=true
    volumes:
      - ../shared/db/migrations:/flyway/sql:ro
    command: migrate
    restart: "no"  # Run once and exit

  ############################
  #  3) Message Service      #
  ############################
  message-service:
    build:
      context: ../message-service
      dockerfile: Dockerfile
    container_name: spara-message-service-dev
    depends_on:
      - redis
      - message_store
    ports:
      - "8000:8000"
    env_file:
      - ../message-service/.env

  ############################
  #  4) LLM Service          #
  ############################
  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile.dev
    container_name: spara-llm-service-dev
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis

  ############################
  #  5) Frontend (React)     #
  ############################
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: spara-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_MS_URL=http://localhost:8000
      - VITE_MS_SOCKETIO_URL=ws://localhost:8000
    depends_on:
      - message-service

volumes:
  message_store_data:
