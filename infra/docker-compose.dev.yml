name: spara-dev
services:
  ############################
  #  1) Redis                #
  ############################
  redis:
    image: redis:latest
    container_name: spara-redis-dev
    ports:
      - "6379:6379"

  ############################
  #  2) PostgreSQL           #
  ############################
  message_store:
    image: postgres:13
    container_name: spara-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: &dev_db_user postgres
      POSTGRES_PASSWORD: &dev_db_password postgres
      POSTGRES_DB: &dev_db_name message_store
    volumes:
      - message_store_data:/var/lib/postgresql/data
      - ../shared/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql
          --host=message_store
          --username="$$POSTGRES_USER"
          --dbname="$$POSTGRES_DB"
          --no-password
          --command="SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ############################
  #  3) Message Service      #
  ############################
  message-service:
    build:
      context: ../message-service
      dockerfile: Dockerfile
    container_name: spara-message-service-dev
    depends_on:
      redis:
        condition: service_started
      message_store:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../message-service/.env
    # Local dev always connects to its bundled database, regardless of .env.
    environment:
      SQL_DB_HOST: message_store
      SQL_DB_PORT: "5432"
      SQL_DB_NAME: *dev_db_name
      SQL_DB_USER: *dev_db_user
      SQL_DB_PASSWORD: *dev_db_password

  ############################
  #  4) LLM Service          #
  ############################
  llm-service:
    build:
      context: ../llm-service
      dockerfile: Dockerfile.dev
    container_name: spara-llm-service-dev
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis

  ############################
  #  5) Frontend (React)     #
  ############################
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: spara-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_MS_URL=http://localhost:8000
      - VITE_MS_SOCKETIO_URL=ws://localhost:8000
      - CHOKIDAR_USEPOLLING=true # Added for hot reloading in Docker
    depends_on:
      - message-service
  ############################
  #  6) pgAdmin              #
  ############################
  pgadmin:
    image: dpage/pgadmin4
    container_name: spara-pgadmin-dev
    ports:
      - "8080:80"  # Maps port 8080 on your host to port 80 in the container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  # Set your admin email
      PGADMIN_DEFAULT_PASSWORD: admin          # Set your admin password
    depends_on:
      - message_store
volumes:
  message_store_data:
