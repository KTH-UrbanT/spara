name: Build Docker Images

on:
  push:
    branches:
      - 'test/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/spara

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      # Step 1: Checkout main repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 2: Configure git to use HTTPS with authentication
      - name: Configure git for authenticated HTTPS submodules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git to use HTTPS instead of SSH
          git config --global url."https://github.com/".insteadOf git@github.com:
          
          # Configure git to use the token for authentication
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          # Now initialize submodules
          git submodule sync
          git submodule update --init --recursive
      
      # Step 3: Create version tag
      - name: Create version tag
        id: version
        run: |
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      # Step 4: Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 5: Build Frontend
      - name: Build Frontend
        run: |
          cd frontend
          docker build \
            --build-arg VITE_MS_URL=https://sparabot.com \
            --build-arg VITE_MS_SOCKETIO_URL=wss://sparabot.com \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.version.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
      
      # Step 6: Build Message Service
      - name: Build Message Service
        run: |
          cd message-service
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/message-service:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/message-service:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/message-service:${{ steps.version.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/message-service:latest
      
      # Step 7: Build LLM Service
      - name: Build LLM Service
        run: |
          cd llm-service
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/llm-service:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/llm-service:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/llm-service:${{ steps.version.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/llm-service:latest
      
      # Step 8: Build summary
      - name: Summary
        run: |
          echo "✅ Built version: ${{ steps.version.outputs.tag }}"
          echo "📦 Images pushed to GitHub Container Registry"
          echo "🔀 Triggered from: ${{ github.ref }}"