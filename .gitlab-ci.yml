workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: always
    - when: never

stages:
  - deploy

variables:
  DEPLOY_ROOT: "/home/gitlab-runner/spara-deploy"
  WORKDIR: "$DEPLOY_ROOT/current"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

deploy_test:
  stage: deploy
  tags:
    - sciencecloud
  resource_group: test_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never

  script:
    - set -euo pipefail

    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
    - echo "CI_PIPELINE_ID=$CI_PIPELINE_ID"
    - echo "Deploying commit $CI_COMMIT_SHA from branch $CI_COMMIT_BRANCH"

    # Prepare workspace - remove old workdir completely, including hidden .git state
    - rm -rf "$WORKDIR"
    - mkdir -p "$WORKDIR"

    # Copy repo WITHOUT .git
    - rsync -a --delete --exclude='.git' ./ "$WORKDIR"/

    # Configure GitHub token for private submodules (HTTPS)
    - test -n "$GITHUB_TOKEN"
    - git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
    - git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"

    # Submodules
    - cd "$WORKDIR"
    - git submodule sync --recursive || true
    - git submodule update --init --recursive || true

    # Write backend env files from GitLab variables
    - printf "%s" "$MESSAGE_ENV_FILE" > "$WORKDIR/message-service/.env"
    - printf "%s" "$LLM_ENV_FILE" > "$WORKDIR/llm-service/.env"

    # Write frontend env file and inject deployment metadata for UI
    - mkdir -p "$WORKDIR/frontend"
    - printf "%s\n" "${FRONTEND_ENV_FILE:-}" > "$WORKDIR/frontend/.env"
    - DEPLOYMENT_TAG="$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
    - printf "VITE_DEPLOYMENT_TAG=%s\n" "$DEPLOYMENT_TAG" >> "$WORKDIR/frontend/.env"
    - printf "VITE_BUILD_TIME=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$WORKDIR/frontend/.env"
    - printf "VITE_COMMIT_SHA=%s\n" "$CI_COMMIT_SHA" >> "$WORKDIR/frontend/.env"
    - printf "VITE_BRANCH=%s\n" "$CI_COMMIT_BRANCH" >> "$WORKDIR/frontend/.env"

    - chmod 600 "$WORKDIR/message-service/.env" "$WORKDIR/llm-service/.env" "$WORKDIR/frontend/.env"

    # Optional debug output for frontend deployment info
    - echo "Frontend deployment metadata:"
    - grep '^VITE_' "$WORKDIR/frontend/.env"

    # Ensure docker network exists
    - docker network inspect spara_test_network >/dev/null 2>&1 || docker network create spara_test_network

    # Show docker usage before deploy
    - docker system df || true

    # Deploy only this stack. Do not touch external reverse proxy / nginx setup.
    - cd "$WORKDIR/infra"
    - docker compose -f docker-compose.test.yml pull || true
    - docker compose -f docker-compose.test.yml up -d --build --force-recreate --remove-orphans

    # Remove only stale artifacts generated by builds/deploys. Do not touch volumes.
    - docker image prune -f
    - docker builder prune -af --filter "until=168h" || true

    # Show result
    - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
    - docker system df || true