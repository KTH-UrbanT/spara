workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: always
    - if: '$CI_COMMIT_BRANCH == "demo"'
      when: always
    - when: never

stages:
  - prepare
  - build
  - test
  - deploy_staging
  - deploy_demo

variables:
  DEPLOY_ROOT_TEST: "/home/gitlab-runner/spara-deploy"
  WORKDIR_TEST: "$DEPLOY_ROOT_TEST/current"
  COMPOSE_FILE_TEST: "docker-compose.test.yml"

  DEPLOY_ROOT_DEMO: "/home/gitlab-runner/spara-demo-deploy"
  WORKDIR_DEMO: "$DEPLOY_ROOT_DEMO/current"
  COMPOSE_FILE_DEMO: "docker-compose.demo.yml"

  GIT_SUBMODULE_STRATEGY: none
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  TEST_NETWORK: "spara-ci-${CI_PIPELINE_ID}"
  TEST_POSTGRES: "spara-ci-${CI_PIPELINE_ID}-postgres"
  TEST_REDIS: "spara-ci-${CI_PIPELINE_ID}-redis"

prepare_environment:
  stage: prepare
  tags:
    - sciencecloud
  resource_group: test_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail

      export DEPLOY_ROOT="$DEPLOY_ROOT_TEST"
      export WORKDIR="$WORKDIR_TEST"

      echo "Preparing TEST environment for branch $CI_COMMIT_BRANCH"
      echo "Commit: $CI_COMMIT_SHA"
      echo "Pipeline: $CI_PIPELINE_ID"

      test -n "$GITHUB_TOKEN"
      git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"

      cd "$CI_PROJECT_DIR"
      git submodule sync --recursive
      git submodule update --init --recursive

      echo "Resolved submodule SHAs:"
      git submodule status

      rm -rf "$WORKDIR"
      mkdir -p "$WORKDIR"

      rsync -a --delete --exclude='.git' "$CI_PROJECT_DIR"/ "$WORKDIR"/

      printf "%s" "$MESSAGE_ENV_FILE_TEST" > "$WORKDIR/message-service/.env"
      printf "%s" "$LLM_ENV_FILE_TEST" > "$WORKDIR/llm-service/.env"

      mkdir -p "$WORKDIR/frontend"
      printf "%s\n" "${FRONTEND_ENV_FILE_TEST:-}" > "$WORKDIR/frontend/.env"

      DEPLOYMENT_TAG="$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
      printf "VITE_DEPLOYMENT_TAG=%s\n" "$DEPLOYMENT_TAG" >> "$WORKDIR/frontend/.env"
      printf "VITE_BUILD_TIME=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$WORKDIR/frontend/.env"
      printf "VITE_COMMIT_SHA=%s\n" "$CI_COMMIT_SHA" >> "$WORKDIR/frontend/.env"
      printf "VITE_BRANCH=%s\n" "$CI_COMMIT_BRANCH" >> "$WORKDIR/frontend/.env"

      chmod 600 \
        "$WORKDIR/message-service/.env" \
        "$WORKDIR/llm-service/.env" \
        "$WORKDIR/frontend/.env"

      echo "Frontend deployment metadata:"
      grep '^VITE_' "$WORKDIR/frontend/.env"

      test -f "$WORKDIR/message-service/Dockerfile"
      test -f "$WORKDIR/llm-service/Dockerfile"
      test -f "$WORKDIR/frontend/Dockerfile"
      test -f "$WORKDIR/infra/$COMPOSE_FILE_TEST"

build_message_service:
  stage: build
  tags:
    - sciencecloud
  resource_group: test_deploy
  needs:
    - prepare_environment
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_TEST"
      cd "$WORKDIR/infra"
      docker compose -f "$COMPOSE_FILE_TEST" build message-service

build_llm_service:
  stage: build
  tags:
    - sciencecloud
  resource_group: test_deploy
  needs:
    - prepare_environment
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_TEST"
      cd "$WORKDIR/infra"
      docker compose -f "$COMPOSE_FILE_TEST" build llm-service

build_frontend:
  stage: build
  tags:
    - sciencecloud
  resource_group: test_deploy
  needs:
    - prepare_environment
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_TEST"
      cd "$WORKDIR/infra"
      docker compose -f "$COMPOSE_FILE_TEST" build frontend

test_message_service:
  stage: test
  tags:
    - sciencecloud
  resource_group: test_deploy
  needs:
    - prepare_environment
    - build_message_service
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_TEST"

      cleanup() {
        docker rm -f "$TEST_POSTGRES" "$TEST_REDIS" >/dev/null 2>&1 || true
        docker network rm "$TEST_NETWORK" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      set -a
      . "$WORKDIR/message-service/.env"
      set +a

      docker network create "$TEST_NETWORK" >/dev/null 2>&1 || true

      echo "Starting isolated Postgres and Redis for message-service tests..."
      docker run -d --name "$TEST_POSTGRES" --network "$TEST_NETWORK" \
        -e POSTGRES_USER=postgres \
        -e POSTGRES_PASSWORD=postgres \
        postgres:13

      docker run -d --name "$TEST_REDIS" --network "$TEST_NETWORK" redis:latest

      echo "Waiting for Postgres server..."
      for i in $(seq 1 30); do
        if docker exec "$TEST_POSTGRES" pg_isready -U postgres >/dev/null 2>&1; then
          echo "Postgres server is ready"
          break
        fi
        echo "Waiting for Postgres... ($i/30)"
        sleep 2
        if [ "$i" -eq 30 ]; then
          echo "Postgres did not become ready in time"
          exit 1
        fi
      done

      echo "Ensuring message_store database exists..."
      docker exec -i "$TEST_POSTGRES" psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
      SELECT 'CREATE DATABASE message_store'
      WHERE NOT EXISTS (
        SELECT FROM pg_database WHERE datname = 'message_store'
      )\gexec
      SQL

      echo "Creating app DB role in isolated Postgres..."
      docker exec -i "$TEST_POSTGRES" psql -v ON_ERROR_STOP=1 -U postgres -d message_store <<SQL
      DO \$\$
      BEGIN
         IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${SQL_DB_USER}') THEN
            CREATE ROLE ${SQL_DB_USER} LOGIN PASSWORD '${SQL_DB_PASSWORD}';
         ELSE
            ALTER ROLE ${SQL_DB_USER} WITH PASSWORD '${SQL_DB_PASSWORD}';
         END IF;
      END
      \$\$;

      GRANT CONNECT ON DATABASE message_store TO ${SQL_DB_USER};
      GRANT USAGE ON SCHEMA public TO ${SQL_DB_USER};
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ${SQL_DB_USER};
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ${SQL_DB_USER};

      ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ${SQL_DB_USER};

      ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO ${SQL_DB_USER};
      SQL

      echo "Running message-service tests..."
      docker run --rm --network "$TEST_NETWORK" \
        --env-file "$WORKDIR/message-service/.env" \
        -e SQL_DB_HOST="$TEST_POSTGRES" \
        -e SQL_DB_NAME="message_store" \
        -e SQL_DB_PORT="5432" \
        -e REDIS_HOST="$TEST_REDIS" \
        --entrypoint bash \
        spara-test-message-service \
        -lc 'if [ -d tests ]; then PYTHONPATH=/message-service pytest tests/; else echo "No tests directory found in message-service"; exit 1; fi'

test_llm_service:
  stage: test
  tags:
    - sciencecloud
  resource_group: test_deploy
  needs:
    - prepare_environment
    - build_llm_service
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_TEST"

      cleanup() {
        docker rm -f "$TEST_REDIS" >/dev/null 2>&1 || true
        docker network rm "$TEST_NETWORK" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      docker network create "$TEST_NETWORK" >/dev/null 2>&1 || true

      echo "Starting isolated Redis for llm-service tests..."
      docker run -d --name "$TEST_REDIS" --network "$TEST_NETWORK" redis:latest

      echo "Running llm-service tests..."
      docker run --rm --network "$TEST_NETWORK" \
        --env-file "$WORKDIR/llm-service/.env" \
        -e REDIS_HOST="$TEST_REDIS" \
        --entrypoint bash \
        spara-test-llm-service \
        -lc 'if [ -d tests ]; then PYTHONPATH=/llm-service pytest tests/; else echo "No tests directory found in llm-service"; exit 1; fi'

deploy_and_validate_remote_staging:
  stage: deploy_staging
  tags:
    - sciencecloud
  resource_group: test_deploy
  needs:
    - prepare_environment
    - build_message_service
    - build_llm_service
    - build_frontend
    - test_message_service
    - test_llm_service
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_TEST"

      retry_compose_up() {
        local tries=3
        local n=1
        until docker compose -f "$COMPOSE_FILE_TEST" up -d --force-recreate --remove-orphans; do
          if [ "$n" -ge "$tries" ]; then
            echo "docker compose up failed after $tries attempts"
            return 1
          fi
          echo "Deploy attempt $n failed, retrying..."
          n=$((n+1))
          sleep 10
        done
      }

      validate_staging() {
        echo "Validating message-service DB connectivity..."
        docker exec -i spara-message-service python - <<'PY'
      import os, psycopg2
      conn = psycopg2.connect(
          host=os.getenv("SQL_DB_HOST"),
          dbname=os.getenv("SQL_DB_NAME"),
          user=os.getenv("SQL_DB_USER"),
          password=os.getenv("SQL_DB_PASSWORD"),
          port=os.getenv("SQL_DB_PORT"),
      )
      print("Deployed message-service DB connection OK")
      conn.close()
      PY

        echo "Validating frontend..."
        for i in $(seq 1 20); do
          if curl -fsS http://127.0.0.1:8808 >/dev/null; then
            echo "Frontend is reachable"
            return 0
          fi
          echo "Waiting for frontend... ($i/20)"
          sleep 3
        done

        echo "Frontend did not become ready in time"
        echo "Frontend logs:"
        docker logs --tail 100 spara-frontend-test || true
        return 1
      }

      echo "Deploying tested branch $CI_COMMIT_BRANCH"
      echo "Commit: $CI_COMMIT_SHA"

      docker network inspect spara_test_network >/dev/null 2>&1 || docker network create spara_test_network

      echo "Docker usage before deploy:"
      docker system df || true

      cd "$WORKDIR/infra"

      echo "Backing up staging DB before deploy..."
      if docker ps --format '{{.Names}}' | grep -qx spara-postgres-test; then
        docker exec spara-postgres-test pg_dump -U postgres -d message_store -Fc > /tmp/spara-staging-backup.dump
      else
        rm -f /tmp/spara-staging-backup.dump
      fi

      echo "Deploying already built images..."
      if ! retry_compose_up; then
        echo "Deployment failed"
        docker compose -f "$COMPOSE_FILE_TEST" ps || true
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
        exit 1
      fi

      echo "Validating staging deployment..."
      if ! validate_staging; then
        echo "Validation failed"
        docker compose -f "$COMPOSE_FILE_TEST" ps || true
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
        exit 1
      fi

      docker compose -f "$COMPOSE_FILE_TEST" ps
      docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      echo "Root disk usage before cleanup:"
      df -h /

      echo "Docker usage before cleanup:"
      docker system df || true

      echo "Cleaning Docker build cache only..."
      docker builder prune -af --filter "until=168h" || true

      echo "Root disk usage after cleanup:"
      df -h /

      echo "Docker usage after cleanup:"
      docker system df || true

prepare_demo_environment:
  stage: prepare
  tags:
    - demo
  resource_group: demo_deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail

      export DEPLOY_ROOT="$DEPLOY_ROOT_DEMO"
      export WORKDIR="$WORKDIR_DEMO"

      echo "Preparing DEMO environment for branch $CI_COMMIT_BRANCH"
      echo "Commit: $CI_COMMIT_SHA"
      echo "Pipeline: $CI_PIPELINE_ID"

      test -n "$GITHUB_TOKEN"
      git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"

      cd "$CI_PROJECT_DIR"
      git submodule sync --recursive
      git submodule update --init --recursive

      echo "Resolved submodule SHAs:"
      git submodule status

      rm -rf "$WORKDIR"
      mkdir -p "$WORKDIR"

      rsync -a --delete --exclude='.git' "$CI_PROJECT_DIR"/ "$WORKDIR"/

      printf "%s" "$MESSAGE_ENV_FILE_DEMO" > "$WORKDIR/message-service/.env"
      printf "%s" "$LLM_ENV_FILE_DEMO" > "$WORKDIR/llm-service/.env"

      mkdir -p "$WORKDIR/frontend"
      printf "%s\n" "${FRONTEND_ENV_FILE_DEMO:-}" > "$WORKDIR/frontend/.env"

      DEPLOYMENT_TAG="$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
      printf "VITE_DEPLOYMENT_TAG=%s\n" "$DEPLOYMENT_TAG" >> "$WORKDIR/frontend/.env"
      printf "VITE_BUILD_TIME=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$WORKDIR/frontend/.env"
      printf "VITE_COMMIT_SHA=%s\n" "$CI_COMMIT_SHA" >> "$WORKDIR/frontend/.env"
      printf "VITE_BRANCH=%s\n" "$CI_COMMIT_BRANCH" >> "$WORKDIR/frontend/.env"

      chmod 600 \
        "$WORKDIR/message-service/.env" \
        "$WORKDIR/llm-service/.env" \
        "$WORKDIR/frontend/.env"

      echo "Frontend deployment metadata:"
      grep '^VITE_' "$WORKDIR/frontend/.env"

      test -f "$WORKDIR/message-service/Dockerfile"
      test -f "$WORKDIR/llm-service/Dockerfile"
      test -f "$WORKDIR/frontend/Dockerfile"
      test -f "$WORKDIR/infra/$COMPOSE_FILE_DEMO"

build_demo_message_service:
  stage: build
  tags:
    - demo
  resource_group: demo_deploy
  needs:
    - prepare_demo_environment
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_DEMO"
      cd "$WORKDIR/infra"
      docker-compose -f "$COMPOSE_FILE_DEMO" build message-service

build_demo_llm_service:
  stage: build
  tags:
    - demo
  resource_group: demo_deploy
  needs:
    - prepare_demo_environment
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_DEMO"
      cd "$WORKDIR/infra"
      docker-compose -f "$COMPOSE_FILE_DEMO" build llm-service

build_demo_frontend:
  stage: build
  tags:
    - demo
  resource_group: demo_deploy
  needs:
    - prepare_demo_environment
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_DEMO"
      cd "$WORKDIR/infra"
      docker-compose -f "$COMPOSE_FILE_DEMO" build frontend

deploy_demo:
  stage: deploy_demo
  tags:
    - demo
  resource_group: demo_deploy
  needs:
    - prepare_demo_environment
    - build_demo_message_service
    - build_demo_llm_service
    - build_demo_frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
      when: manual
    - when: never
  script:
    - |
      set -euo pipefail
      export WORKDIR="$WORKDIR_DEMO"

      retry_compose_up() {
        local tries=3
        local n=1
        until docker-compose -f "$COMPOSE_FILE_DEMO" up -d --force-recreate --remove-orphans; do
          if [ "$n" -ge "$tries" ]; then
            echo "docker-compose up failed after $tries attempts"
            return 1
          fi
          echo "Deploy attempt $n failed, retrying..."
          n=$((n+1))
          sleep 10
        done
      }

      validate_demo() {
        echo "Validating message-service DB connectivity..."
        docker-compose -f "$COMPOSE_FILE_DEMO" exec -T message-service python - <<'PY'
      import os, psycopg2
      conn = psycopg2.connect(
          host=os.getenv("SQL_DB_HOST"),
          dbname=os.getenv("SQL_DB_NAME"),
          user=os.getenv("SQL_DB_USER"),
          password=os.getenv("SQL_DB_PASSWORD"),
          port=os.getenv("SQL_DB_PORT"),
      )
      print("Demo DB connection OK")
      conn.close()
      PY

        echo "Validating frontend..."
        for i in $(seq 1 20); do
          if curl -fsS http://127.0.0.1:8808 >/dev/null; then
            echo "Frontend is reachable"
            return 0
          fi
          echo "Waiting for frontend... ($i/20)"
          sleep 3
        done

        echo "Frontend did not become ready in time"
        echo "Frontend logs:"
        docker-compose -f "$COMPOSE_FILE_DEMO" logs --tail=100 frontend || true
        return 1
      }

      echo "Deploying demo branch $CI_COMMIT_BRANCH"
      echo "Commit: $CI_COMMIT_SHA"

      docker network inspect spara_demo_network >/dev/null 2>&1 || docker network create spara_demo_network

      echo "Docker usage before deploy:"
      docker system df || true

      cd "$WORKDIR/infra"

      echo "Deploying already built images..."
      if ! retry_compose_up; then
        echo "Deployment failed"
        docker-compose -f "$COMPOSE_FILE_DEMO" ps || true
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
        exit 1
      fi

      echo "Validating demo deployment..."
      if ! validate_demo; then
        echo "Validation failed"
        docker-compose -f "$COMPOSE_FILE_DEMO" ps || true
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
        exit 1
      fi

      docker-compose -f "$COMPOSE_FILE_DEMO" ps
      docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      echo "Root disk usage before cleanup:"
      df -h /

      echo "Docker usage before cleanup:"
      docker system df || true

      echo "Cleaning Docker build cache only..."
      docker builder prune -af --filter "until=168h" || true

      echo "Root disk usage after cleanup:"
      df -h /

      echo "Docker usage after cleanup:"
      docker system df || true
