stages:
  - build
  - test
  - deploy

variables:
  COMPOSE_FILE: infra/docker-compose.test.yml
  REMOTE_USER: ubuntu
  REMOTE_HOST: 130.238.28.49
  REMOTE_PATH: /home/ubuntu/sparaRemote/infra
  REMOTE_PRIVATE_KEY: $SSH_MG_REMOTE
  GITHUB_PRIVATE_KEY: $SSH_MG_PRIVATE_KEY

before_script:
  # install needed CLIs
  - apk add --no-cache git docker-compose openssh-client rsync

  # prepare SSH dir and keys
  - mkdir -p ~/.ssh
  - echo "$GITHUB_PRIVATE_KEY" > ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - echo "$REMOTE_PRIVATE_KEY" > ~/.ssh/remote_key
  - chmod 600 ~/.ssh/remote_key

  # trust hosts
  - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts

  # fetch submodules using the GitHub key
  - |
    GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no" \
      git submodule update --init --recursive

  # inject .env files
  - echo "$MESSAGE_SERVICE_ENV" > message-service/.env
  - echo "$LLM_SERVICE_ENV"      > llm-service/.env

container_test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker-compose -f $COMPOSE_FILE up -d --build
    - docker-compose exec message-service bash -c "PYTHONPATH=/message-service pytest tests/"
  only:
    - /^test\/.*/

deploy_to_remote:
  stage: deploy
  image: docker:latest
  script:
    # copy the infra/ folder to the remote
    - rsync -avz -e "ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no" infra/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/

    # ssh in (using the remote_key) and restart
    - |  
      ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<EOF  
      cd $REMOTE_PATH
      docker-compose up -d --build
      EOF
  only:
    - /^test\/.*/  

