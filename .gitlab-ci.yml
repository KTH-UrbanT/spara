workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\/.+$/'
      when: always
    - when: never

stages: [deploy]

variables:
  DEPLOY_ROOT: "/home/gitlab-runner/spara-deploy"
  WORKDIR: "$DEPLOY_ROOT/current"

deploy_test:
  stage: deploy
  tags: [sciencecloud]

  # Only deploy if this branch equals the selected branch variable
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_TEST_BRANCH'
      when: on_success
    - when: never

  script:
    - echo "DEPLOY_TEST_BRANCH=$DEPLOY_TEST_BRANCH"
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
    - test "$CI_COMMIT_BRANCH" = "$DEPLOY_TEST_BRANCH"

  script:
    - set -euo pipefail

    - echo "Deploying commit $CI_COMMIT_SHA from branch $CI_COMMIT_BRANCH"

    # Prepare workspace
    - mkdir -p "$WORKDIR"
    - rm -rf "$WORKDIR"/*
    - cp -a . "$WORKDIR"

    # Pull submodules at the exact commit recorded in repo
    - cd "$WORKDIR"
    - git submodule sync --recursive || true
    - git submodule update --init --recursive

    # Write env files from GitLab variables
    - printf "%s" "$MESSAGE_ENV_FILE" > "$WORKDIR/message-service/.env"
    - printf "%s" "$LLM_ENV_FILE"     > "$WORKDIR/llm-service/.env"
    - chmod 600 "$WORKDIR/message-service/.env" "$WORKDIR/llm-service/.env"

    # Ensure docker network exists
    - docker network inspect spara_test_network >/dev/null 2>&1 || docker network create spara_test_network

    # Deploy
    - cd "$WORKDIR/infra"
    - docker compose -f docker-compose.test.yml build --no-cache
    - docker compose -f docker-compose.test.yml up -d --force-recreate

    # Show running containers
    - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"


