
stages: [deploy]

variables:
  DEPLOY_ROOT: "/home/gitlab-runner/spara-deploy"
  # This is the folder layout your compose expects (../frontend etc.)
  WORKDIR: "$DEPLOY_ROOT/current"

deploy_test:
  stage: deploy
  tags:
    - sciencecloud
  when: manual
  script:
    - set -euo pipefail

    # 1) Show what refs we're deploying (good for logs)
    - echo "Deploying refs:"
    - echo "  FRONTEND_REF=$FRONTEND_REF"
    - echo "  MESSAGE_REF=$MESSAGE_REF"
    - echo "  LLM_REF=$LLM_REF"

    # 2) Prepare folder structure
    - mkdir -p "$WORKDIR"
    - rm -rf "$WORKDIR/frontend" "$WORKDIR/message-service" "$WORKDIR/llm-service"
    - mkdir -p "$WORKDIR"

    # 3) Copy infra + shared from THIS repo into the workdir
    - rm -rf "$WORKDIR/infra" "$WORKDIR/shared"
    - cp -a infra "$WORKDIR/infra"
    - cp -a shared "$WORKDIR/shared"

    # 4) Clone the 3 repos at the chosen refs
    - git clone --depth 1 --branch "$FRONTEND_REF" "$FRONTEND_REPO" "$WORKDIR/frontend"
    - git clone --depth 1 --branch "$MESSAGE_REF"  "$MESSAGE_REPO"  "$WORKDIR/message-service"
    - git clone --depth 1 --branch "$LLM_REF"      "$LLM_REPO"      "$WORKDIR/llm-service"

    # 5) Write env files from GitLab variables
    - printf "%s" "$MESSAGE_ENV_FILE" > "$WORKDIR/message-service/.env"
    - printf "%s" "$LLM_ENV_FILE"     > "$WORKDIR/llm-service/.env"
    - chmod 600 "$WORKDIR/message-service/.env" "$WORKDIR/llm-service/.env"

    # 6) Ensure the external docker network exists (your compose requires it)
    - docker network inspect spara_test_network >/dev/null 2>&1 || docker network create spara_test_network

    # 7) Bring up the stack (adjust filename if needed)
    - cd "$WORKDIR/infra"
    - docker compose -f docker-compose.test.yml build --no-cache
    - docker compose -f docker-compose.test.yml up -d --force-recreate

    # 8) Show result
    - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
