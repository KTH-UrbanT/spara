# Assembly Pipeline

stages:
  - prepare
  - build
  - test
  - deploy

variables:
  COMPOSE_FILE_TEST: docker-compose.test.yml
  COMPOSE_FILE_TEST_CI: docker-compose.test.ci.yml
  REMOTE_USER: ubuntu
  REMOTE_HOST: $STAGING_HOST
  REMOTE_PATH: /home/ubuntu/spara

  SSH_TEST_REMOTE_HOST_KEY: $SSH_STAGING_HOST_KEY
  SSH_GITHUB_PRIVATE_KEY: $SSH_GITHUB_KEY

# The 'container_setup' job initializes the Git repository, installs necessary dependencies,
# and prepares the environment for testing and deployment.
before_script:
  # install needed CLIs
  - apk add --no-cache git openssh-client rsync

  # prepare SSH dir and keys
  - mkdir -p ~/.ssh
  - echo "$SSH_GITHUB_PRIVATE_KEY" > ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - echo "$SSH_TEST_REMOTE_HOST_KEY" > ~/.ssh/test_remote_key
  - chmod 600 ~/.ssh/test_remote_key

  # trust hosts
  - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts

  # inject .env files
  - echo "$MESSAGE_SERVICE_ENV" > message-service/.env
  - echo "$LLM_SERVICE_ENV"     > llm-service/.env
  
  # Configure git user for all jobs
  - git config --global user.email "ci@sparabot.com"
  - git config --global user.name "CI Bot"

# Prepare the environment
# Here we load the submodules as given, from GitHub (using SSH_GITHUB_PRIVATE_KEY).
# We do this since GitHub allways has the latest versions, and pulling from
# GitLab can lead to issues with submodule SHAs.
prepare_environment:
  stage: prepare
  image: alpine:latest
  script:
    # Clean any existing submodule directories first
    - rm -rf message-service llm-service frontend
    - rm -f message-service.tar llm-service.tar frontend.tar
    # Get submodules
    - GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no" git submodule update --init --recursive
    # Lock submodule SHAs for the test branch
    - git add message-service llm-service frontend
    - git commit -m "Lock submodule SHAs for test branch" || echo "No changes to commit"
  artifacts:
    paths:
      - message-service/
      - llm-service/
      - frontend/
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Build images
# Here we build the Docker images for the services, using the Docker Compose file,
# and save them as tar files for later use (to speed up deployment).
build_images:
  stage: build
  image: docker:24.0-cli
  needs: 
    - prepare_environment
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - docker compose -f infra/$COMPOSE_FILE_TEST build --pull --no-cache

    - docker save -o message-service.tar message-service:test
    - docker save -o llm-service.tar llm-service:test
    - docker save -o frontend.tar frontend:test
  after_script:
    # Clean up Docker images from the runner
    - docker image prune -f || true
    - docker container prune -f || true
  artifacts:
    paths:
      - message-service.tar
      - llm-service.tar
      - frontend.tar
    expire_in: 24 hour
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Frontend test job
# Here we load the frontend Docker image, start the service using Docker Compose,
# and run tests. After successful tests, we tag the submodule with a timestamp,
# and finally push the tag to the remote repository (on GitHub).
test_frontend:
  stage: test
  image: docker:24.0-cli
  needs:
    - build_images
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - docker load -i message-service.tar
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d message-service
    # Tag the submodule after successful tests
    - echo "Frontend tests placeholder"
    # Tag the submodule after successful tests
    - |
      set -e
      cd frontend
      export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no"

      git remote set-url origin git@github.com:KTH-UrbanT/spara-frontend.git

      # Get the correct version (including history)
      echo "1"
      git branch
      git fetch origin
      echo "2"
      git branch
      git checkout dev
      echo "3"
      git branch

      # Tagging
      TAG_NAME="tested-$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
      echo "Tagging frontend with: $TAG_NAME"
      git tag -a "$TAG_NAME" -m "Tested version from assembly pipeline ${CI_PIPELINE_ID}"
      git push origin "$TAG_NAME"
      echo "FRONTEND_TAG=$TAG_NAME" >> ../frontend_tag.env
  artifacts:
    reports:
      dotenv: frontend_tag.env
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Message Service test job
# The process is similar to the frontend test job.
test_message_service:
  stage: test
  image: docker:24.0-cli
  needs:
    - build_images
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - docker load -i message-service.tar
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d message-service
    - docker compose -f infra/$COMPOSE_FILE_TEST exec message-service bash -c "if [ -d tests ]; then PYTHONPATH=/message-service pytest tests/; else echo 'No tests directory found.'; fi"
    # Tag the submodule after successful tests
    - |
      set -e
      cd message-service
      export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no"

      git remote set-url origin git@github.com:KTH-UrbanT/spara-message-service.git
      
      # Get the correct version (including history)
      git fetch origin
      git checkout dev

      # Tagging
      TAG_NAME="tested-$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
      echo "Tagging message-service with: $TAG_NAME"
      git tag -a "$TAG_NAME" -m "Tested version from assembly pipeline ${CI_PIPELINE_ID}"
      git push origin "$TAG_NAME"
      echo "MESSAGE_SERVICE_TAG=$TAG_NAME" >> ../message_service_tag.env
  artifacts:
    reports:
      dotenv: message_service_tag.env
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# LLM Service test job
# The process is similar to the message service test job.
test_llm_service:
  stage: test
  image: docker:24.0-cli
  needs:
    - build_images
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - docker load -i llm-service.tar
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d llm-service
    - docker compose -f infra/$COMPOSE_FILE_TEST exec llm-service bash -c "if [ -d tests ]; then PYTHONPATH=/llm-service pytest tests/; else echo 'No tests directory found.'; fi"
    # Tag the submodule after successful tests
    - |
      set -e
      cd llm-service
      export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no"
      git remote set-url origin git@github.com:KTH-UrbanT/spara-llm-service.git
      
      
      # Get the correct version (including history)
      git fetch origin
      git checkout dev

      # Tagging
      TAG_NAME="tested-$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
      echo "Tagging llm-service with: $TAG_NAME"
      git tag -a "$TAG_NAME" -m "Tested version from assembly pipeline ${CI_PIPELINE_ID}"
      git push origin "$TAG_NAME"
      echo "LLM_SERVICE_TAG=$TAG_NAME" >> ../llm_service_tag.env
  artifacts:
    reports:
      dotenv: llm_service_tag.env
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'


# Syncs files, .envs, and tarballs to the remote server and ensures directories exist.
# Here we connect to the test remote server, stop any running containers, clean the deployment folder,
# and copy the necessary files including the Docker Compose file, .env files, and tarballs
# for the tested Docker images.
sync_staging:
  needs:
    - build_images
    - prepare_environment
    - test_message_service
    - test_llm_service
    - test_frontend
  stage: deploy
  image: docker:24.0-cli
  environment:
    name: staging
    url: https://test.sparabot.com
  script:
    - echo "Preparing and syncing files to remote server"
    # Stop and remove any running containers (only if compose file exists)
    - |
      ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<EOF
        if [ -d "$REMOTE_PATH/infra" ] && [ -f "$REMOTE_PATH/infra/$COMPOSE_FILE_TEST" ]; then
          cd $REMOTE_PATH/infra
          sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI down || true
        fi
      EOF
    # Clean the deployment folder
    - ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "sudo rm -rf $REMOTE_PATH/*"
    # Ensure base directory exists
    - ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $(dirname $REMOTE_PATH)"
    # Copy the infra folder to the remote server
    - rsync -avz -e "ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no" infra/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/infra
    # Create directories for submodules if they don't exist
    - ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_PATH/message-service $REMOTE_PATH/llm-service $REMOTE_PATH/frontend"
    # Copy submodule directories with .env files
    - rsync -avz -e "ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no" message-service/.env $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/message-service/.env
    - rsync -avz -e "ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no" llm-service/.env $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/llm-service/.env
    # Copy the tested Docker images (tar files) to the remote server
    - rsync -avz -e "ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no" message-service.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
    - rsync -avz -e "ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no" llm-service.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
    - rsync -avz -e "ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no" frontend.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Deploys the application: installs Docker if needed, loads images, and starts containers.
deploy_test_env_staging:
  needs:
    - sync_staging
  stage: deploy
  image: docker:24.0-cli
  environment:
    name: staging
    url: https://test.sparabot.com
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - echo "Deploying to test staging server"
    # Install Docker if not installed, load tested images, and start containers
    - |
      ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<EOF
        set -e
        # Install Docker and Compose if not already present
        if ! command -v docker &> /dev/null; then
          echo "Installing Docker and docker compose plugin..."
          sudo apt update
          sudo apt install -y ca-certificates curl gnupg lsb-release
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu \\$(lsb_release -cs) stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt update
          sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        fi
        docker compose version
        # CD into the remote path
        cd $REMOTE_PATH
        # Load the tested Docker images from tar files
        sudo docker load -i message-service.tar
        sudo docker load -i llm-service.tar
        sudo docker load -i frontend.tar
        # Start services with CI overlay using the loaded images
        cd infra
        sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI up -d
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Collect all submodule tags after testing
tag_sub_modules:
  stage: deploy
  image: alpine:latest
  needs:
    - deploy_test_env_staging
    #- test_message_service
    #- test_llm_service
    #- test_frontend
  script:
    - |
      echo "Tested submodule tags:"
      echo "Message Service: $MESSAGE_SERVICE_TAG"
      echo "LLM Service: $LLM_SERVICE_TAG"
      echo "Frontend: $FRONTEND_TAG"
    # Optionally create a release tag for the assembly repo
    - |
      ASSEMBLY_TAG="release-$(date +%Y%m%d-%H%M%S)"
      echo "Creating assembly release tag: $ASSEMBLY_TAG"
      export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no"
      git tag -a "$ASSEMBLY_TAG" -m "Assembly release with tested submodules: MS:$MESSAGE_SERVICE_TAG, LLM:$LLM_SERVICE_TAG, FE:$FRONTEND_TAG"
      git push origin "$ASSEMBLY_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'