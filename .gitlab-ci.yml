# Assembly Pipeline
#
# Note that no cleanup of the docker images run on GitLab
# is needed, since the GitLab runners starts with a fresh
# Docker image for each job.

# Workflow rules to cancel older pipelines when new commits are pushed
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      auto_cancel:
        on_new_commit: interruptible
    - when: never

stages:
  - prepare
  - test
  - deploy
  - finish

variables:
  COMPOSE_FILE_TEST: docker-compose.test.yml
  COMPOSE_FILE_TEST_CI: docker-compose.test.ci.yml
  REMOTE_USER: ubuntu
  REMOTE_HOST: $STAGING_HOST
  REMOTE_PATH: /home/ubuntu/spara

  SSH_TEST_REMOTE_HOST_KEY: $SSH_STAGING_HOST_KEY
  SSH_GITHUB_PRIVATE_KEY: $SSH_GITHUB_KEY
  # Instead of using the repository from GitLab,
  # we get a fresh copy from GitHub. This reduces
  # the requirements on the GitLab and was partially
  # done to fix a version and speed issue.
  GIT_STRATEGY: none

# YAML anchor for cleanup script
.cleanup_script_template: &cleanup_script
  - export SSH_CMD="ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no"
  - |
    $SSH_CMD $REMOTE_USER@$REMOTE_HOST <<EOF
      set -euo pipefail

      echo "Stopping containers if compose file exists..."
      if [ -d "$REMOTE_PATH/infra" ] && [ -f "$REMOTE_PATH/infra/$COMPOSE_FILE_TEST" ]; then
        cd $REMOTE_PATH/infra
        sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI down || true
        echo "Stopped existing containers."
      else
        echo "No existing containers to stop or compose file not found."
      fi

      echo "Disk usage before cleanup:"
      df -h /

      echo "Targeted Docker cleanup..."
      # Remove stopped containers only
      sudo docker rm \$(sudo docker ps -aq -f status=exited) 2>/dev/null || true

      # Remove dangling (untagged) images
      sudo docker rmi \$(sudo docker images -f dangling=true -q) 2>/dev/null || true

      # Remove dangling volumes
      sudo docker volume rm \$(sudo docker volume ls -qf dangling=true) 2>/dev/null || true

      echo "Cleaning up /tmp and old logs..."
      # Only delete files in /tmp that are older than 7 days and not in use
      find /tmp -mtime +7 -and -not -exec fuser -s {} ';' -exec rm -rf {} +
      sudo find /var/log -type f -name "*.gz" -delete
      sudo find /var/log -type f -name "*.1" -delete

      echo "Disk usage after cleanup:"
      df -h /

      USAGE=\$(df / | awk 'NR==2 {print \$5}' | tr -d '%')
      if [ "\$USAGE" -gt 90 ]; then
        echo "ERROR: Root filesystem is still over 90% full. Please free up space before deploying."
        exit 1
      fi
    EOF

# The 'container_setup' job initializes the Git repository, installs necessary dependencies,
# and prepares the environment for testing and deployment.
before_script:
  - set -euo pipefail

  # install needed CLIs (only if running on Alpine)
  - |
    if grep -qi alpine /etc/os-release; then
    apk add --no-cache git openssh git openssh-client rsync
    fi

  # prepare SSH dir and keys
  - mkdir -p ~/.ssh
  - echo "$SSH_GITHUB_PRIVATE_KEY" > ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - echo "$SSH_TEST_REMOTE_HOST_KEY" > ~/.ssh/test_remote_key
  - chmod 600 ~/.ssh/test_remote_key

  # trust hosts
  - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts
  
  # Configure git user for all jobs
  - git config --global user.email "ci@sparabot.com"
  - git config --global user.name "CI Bot"

# Prepare the environment
# Here we load the submodules as given, from GitHub (using SSH_GITHUB_PRIVATE_KEY).
# We do this since GitHub allways has the latest versions, and pulling from
# GitLab can lead to issues with submodule SHAs.
prepare_environment:
  stage: prepare
  image: alpine:3.18
  resource_group: gitlab
  interruptible: true
  script:
    - set -euo pipefail
    - ls
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no"
    - git clone --depth 1 --shallow-submodules --recursive --branch "$CI_COMMIT_REF_NAME" git@github.com:KTH-UrbanT/spara.git .
    - git checkout "$CI_COMMIT_REF_NAME"

    # inject .env files
    - echo "$MESSAGE_SERVICE_ENV" > message-service/.env
    - echo "$LLM_SERVICE_ENV"     > llm-service/.env

    - ls
    - echo "Using shallow clone for improved performance"

  artifacts:
    paths:
      - message-service/
      - llm-service/
      - frontend/
      - shared/
      - infra/
    untracked: false
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Combined remote operations - cleanup, sync, deploy, and validate
# This job holds the remote_test resource lock from beginning to end
# Only runs after tests pass successfully on GitLab servers
deploy_and_validate_remote:
  needs:
    - build_images
    - prepare_environment
    - test_all_services  # Wait for tests to pass before deploying
  stage: deploy
  image: alpine:3.18
  resource_group: remote_test
  interruptible: false  # Don't interrupt deployment once started
  script:
    - set -euo pipefail
    
    # Step 1: Cleanup (from cleanup_remote)
    - echo "=== CLEANUP PHASE ==="
    - export SSH_CMD="ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no"
    - |
      $SSH_CMD $REMOTE_USER@$REMOTE_HOST <<EOF
        set -euo pipefail

        echo "Stopping containers if compose file exists..."
        if [ -d "$REMOTE_PATH/infra" ] && [ -f "$REMOTE_PATH/infra/$COMPOSE_FILE_TEST" ]; then
          cd $REMOTE_PATH/infra
          sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI down || true
          echo "Stopped existing containers."
        else
          echo "No existing containers to stop or compose file not found."
        fi

        echo "Disk usage before cleanup:"
        df -h /

        echo "Targeted Docker cleanup..."
        sudo docker rm \$(sudo docker ps -aq -f status=exited) 2>/dev/null || true
        sudo docker rmi \$(sudo docker images -f dangling=true -q) 2>/dev/null || true
        sudo docker volume rm \$(sudo docker volume ls -qf dangling=true) 2>/dev/null || true

        echo "Cleaning up /tmp and old logs..."
        find /tmp -mtime +7 -and -not -exec fuser -s {} ';' -exec rm -rf {} +
        sudo find /var/log -type f -name "*.gz" -delete
        sudo find /var/log -type f -name "*.1" -delete

        echo "Disk usage after cleanup:"
        df -h /

        USAGE=\$(df / | awk 'NR==2 {print \$5}' | tr -d '%')
        if [ "\$USAGE" -gt 90 ]; then
          echo "ERROR: Root filesystem is still over 90% full. Please free up space before deploying."
          exit 1
        fi
      EOF

    # Step 2: Sync (from sync_staging)
    - echo "=== SYNC PHASE ==="
    - echo "Preparing and syncing files to remote server"
    - $SSH_CMD $REMOTE_USER@$REMOTE_HOST "sudo rm -rf $REMOTE_PATH/*"
    - $SSH_CMD $REMOTE_USER@$REMOTE_HOST "mkdir -p $(dirname $REMOTE_PATH)"
    - rsync -avz -e "$SSH_CMD" infra/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/infra
    - $SSH_CMD $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_PATH/message-service $REMOTE_PATH/llm-service $REMOTE_PATH/frontend"
    - rsync -avz -e "$SSH_CMD" message-service/.env $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/message-service/.env
    - rsync -avz -e "$SSH_CMD" llm-service/.env $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/llm-service/.env
    - rsync -avz -e "$SSH_CMD" message-service.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
    - rsync -avz -e "$SSH_CMD" llm-service.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
    - rsync -avz -e "$SSH_CMD" frontend.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/

    # Step 3: Deploy (from deploy_test_env_staging)
    - echo "=== DEPLOY PHASE ==="
    - echo "Deploying to test staging server"
    - |
      DOCKER_STATUS=$(ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST 'command -v docker >/dev/null 2>&1 && echo "INSTALLED" || echo "NOT_INSTALLED"')
      echo "Docker status: $DOCKER_STATUS"
      
      if [ "$DOCKER_STATUS" = "NOT_INSTALLED" ]; then
        echo "Installing Docker..."
        ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<'EOF'
          set -euo pipefail
          echo "Installing Docker and docker compose plugin..."
          sudo apt update
          sudo apt install -y ca-certificates curl gnupg lsb-release
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt update
          sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      EOF
      else
        echo "Docker already installed, skipping installation"
      fi
    
    - ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST 'docker compose version'
    
    - echo "Loading Docker images..."
    - |
      ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<EOF
        set -euo pipefail
        cd $REMOTE_PATH
        sudo docker load -i message-service.tar
        sudo docker load -i llm-service.tar
        sudo docker load -i frontend.tar
      EOF
    
    - echo "Starting deployment with retry logic..."
    - |
      for attempt in 1 2 3; do
        echo "Deployment attempt $attempt..."
        
        if ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "cd $REMOTE_PATH/infra && sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI up -d --no-deps"; then
          echo "Services started successfully on attempt $attempt"
          break
        else
          echo "Attempt $attempt failed"
          if [ $attempt -lt 3 ]; then
            echo "Cleaning up and waiting 30 seconds before retry..."
            ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "cd $REMOTE_PATH/infra && sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI down || true" || true
            sleep 30
          else
            echo "All deployment attempts failed"
            exit 1
          fi
        fi
      done
    
    - echo "Verifying deployment..."
    - sleep 10
    - ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "cd $REMOTE_PATH/infra && sudo docker compose -f $COMPOSE_FILE_TEST -f $COMPOSE_FILE_TEST_CI ps"

    # Step 4: Validate (from validate_deployment)
    - echo "=== VALIDATION PHASE ==="
    - apk add --no-cache curl
    - |
      echo "Validating deployment..."
      for i in {1..30}; do
        if curl -f -s https://test.sparabot.com/health > /dev/null; then
          echo "Deployment validated successfully"
          break
        fi
        echo "Attempt $i: Service not ready, waiting..."
        sleep 10
        if [ $i -eq 30 ]; then
          echo "Deployment validation failed"
          exit 1
        fi
      done

    # Step 5: Cleanup tar files (from cleanup_tar_files)
    - echo "=== CLEANUP TAR FILES ==="
    - echo "Cleaning up tar files on remote server"
    - ssh -i ~/.ssh/test_remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "rm -f $REMOTE_PATH/*.tar"
    
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Build images
# Here we build the Docker images for the services, using the Docker Compose file,
# and save them as tar files for later use (to speed up deployment).
build_images:
  stage: prepare
  image: docker:24.0-cli
  resource_group: gitlab
  interruptible: true
  needs: 
    - prepare_environment
  services:
    - docker:dind
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - set -euo pipefail

    - docker compose -f infra/$COMPOSE_FILE_TEST build --pull --no-cache

    - docker save -o message-service.tar message-service:test
    - docker save -o llm-service.tar llm-service:test
    - docker save -o frontend.tar frontend:test
  artifacts:
    paths:
      - message-service.tar
      - llm-service.tar
      - frontend.tar
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Combined test job
# Tests all services in dependency order: message-service and llm-service first (both depend on redis),
# then frontend (depends on message-service). Tags all submodules after successful tests.
test_all_services:
  stage: test
  image: docker:24.0-cli
  resource_group: gitlab
  interruptible: true
  needs:
    - build_images
    - prepare_environment
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none # Don't clone the repo, rely on artifacts (might be redundant copy)
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  script:
    - set -euo pipefail

    # Load all Docker images
    - docker load -i message-service.tar
    - docker load -i llm-service.tar
    - docker load -i frontend.tar
    
    # Start dependencies first (redis and postgres)
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d redis message_store
    
    # Test message-service (depends on redis and postgres)
    - echo "Testing message-service..."
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d message-service
    - docker compose -f infra/$COMPOSE_FILE_TEST exec message-service bash -c "if [ -d tests ]; then PYTHONPATH=/message-service pytest tests/; else echo 'No tests directory found.'; fi"
    
    # Test llm-service (depends on redis)
    - echo "Testing llm-service..."
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d llm-service
    - docker compose -f infra/$COMPOSE_FILE_TEST exec llm-service bash -c "if [ -d tests ]; then PYTHONPATH=/llm-service pytest tests/; else echo 'No tests directory found.'; fi"
    
    # Test frontend (depends on message-service)
    - echo "Testing frontend..."
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d frontend
    - echo "Frontend tests placeholder"
    
    # Generate tag names for later use in tagging job
    - touch combined_tags.env
    - MESSAGE_TAG="passed_test-$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
    - LLM_TAG="passed_test-$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
    - FRONTEND_TAG="passed_test-$(date +%Y%m%d-%H%M%S)-${CI_PIPELINE_ID}"
    - echo "MESSAGE_SERVICE_TAG=$MESSAGE_TAG" >> combined_tags.env
    - echo "LLM_SERVICE_TAG=$LLM_TAG" >> combined_tags.env
    - echo "FRONTEND_TAG=$FRONTEND_TAG" >> combined_tags.env
  artifacts:
    reports:
      dotenv: combined_tags.env
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'



# Tag the submodules and the assembly repo after successful tests.
tagging:
  stage: finish
  image: alpine:3.18
  interruptible: false  # Don't interrupt tagging once started
  needs:
    - deploy_and_validate_remote
    - test_all_services  # To get the tag names from dotenv
  script:
    - set -euo pipefail

    - echo "Tested submodule tags $MESSAGE_SERVICE_TAG, $LLM_SERVICE_TAG, $FRONTEND_TAG"
    
    # Fresh clone for tagging (full depth needed for git operations)
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no"
    - git clone --recursive --branch "$CI_COMMIT_REF_NAME" git@github.com:KTH-UrbanT/spara.git tagging_repo
    - cd tagging_repo
    
    # Tag submodules with the test-passed tags
    - echo "Tagging message-service with '$MESSAGE_SERVICE_TAG'"
    - cd message-service
    - git tag -a "$MESSAGE_SERVICE_TAG" -m "Tested version from assembly pipeline ${CI_PIPELINE_ID}"
    - git push origin "$MESSAGE_SERVICE_TAG"
    - cd ..

    - echo "Tagging llm-service with '$LLM_SERVICE_TAG'"
    - cd llm-service
    - git tag -a "$LLM_SERVICE_TAG" -m "Tested version from assembly pipeline ${CI_PIPELINE_ID}"
    - git push origin "$LLM_SERVICE_TAG"
    - cd ..

    - echo "Tagging frontend with '$FRONTEND_TAG'"
    - cd frontend
    - git tag -a "$FRONTEND_TAG" -m "Tested version from assembly pipeline ${CI_PIPELINE_ID}"
    - git push origin "$FRONTEND_TAG"
    - cd ..
    
    # Tag the assembly repo
    - ASSEMBLY_TAG="release-$(date +%Y%m%d-%H%M%S)"
    - echo "Creating assembly release tag $ASSEMBLY_TAG"
    - git tag -a "$ASSEMBLY_TAG" -m "Assembly release with tested submodules MS $MESSAGE_SERVICE_TAG, LLM $LLM_SERVICE_TAG, FE $FRONTEND_TAG"
    - git push origin "$ASSEMBLY_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'

# Cleanup job that runs only on pipeline failure
cleanup_on_failure:
  stage: finish
  image: alpine:3.18
  resource_group: remote_test
  script: *cleanup_script
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: on_failure
  allow_failure: true

