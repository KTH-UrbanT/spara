# Test comment.

# We only need the stages test and deploy for this pipeline,
# as building is done during testing and deployment.
stages:
  - test
  - build
  - sync
  - deploy

variables:
  COMPOSE_FILE_TEST: docker-compose.test.yml
  COMPOSE_FILE_DEPLOY: docker-compose.prod.yml
  REMOTE_USER: ubuntu
  REMOTE_HOST: $STAGING_HOST
  REMOTE_PATH: /home/ubuntu/spara
  SSH_REMOTE_HOST_KEY: $SSH_STAGING_HOST_KEY
  SSH_GITHUB_PRIVATE_KEY: $SSH_MG_PRIVATE_KEY

# The 'container_setup' job initializes the Git repository, installs necessary dependencies,
# and prepares the environment for testing and deployment.
before_script:
  # install needed CLIs
  - apk add --no-cache git openssh-client rsync

  # prepare SSH dir and keys
  - mkdir -p ~/.ssh
  - echo "$SSH_GITHUB_PRIVATE_KEY" > ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - echo "$SSH_REMOTE_HOST_KEY" > ~/.ssh/remote_key
  - chmod 600 ~/.ssh/remote_key

  # trust hosts
  - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts

  # fetch submodules using the GitHub key
  - |
    GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no" \
      git submodule update --init --recursive

  # inject .env files
  - echo "$MESSAGE_SERVICE_ENV" > message-service/.env
  - echo "$LLM_SERVICE_ENV"     > llm-service/.env

# The 'container_test' job builds and starts Docker containers using docker-compose,
# then runs pytest-based unit tests inside both the message-service and llm-service containers.
# It only runs for branches matching the pattern 'test/*'.
container_test:
  stage: test
  image: docker:24.0-cli
  services:
    - docker:dind
  script:
    # Build all containers using the test compose file (no cache for clean builds)
    - docker compose -f infra/$COMPOSE_FILE_TEST build --no-cache
    # Start containers in detached mode for testing
    - docker compose -f infra/$COMPOSE_FILE_TEST up -d
    # Run tests in message-service if tests directory exists
    - docker compose -f infra/$COMPOSE_FILE_TEST exec message-service bash -c "if [ -d tests ]; then PYTHONPATH=/message-service pytest tests/; else echo 'No tests directory found.'; fi"
    # Run tests in llm-service if tests directory exists
    - docker compose -f infra/$COMPOSE_FILE_TEST exec llm-service bash -c "if [ -d tests ]; then PYTHONPATH=/llm-service pytest tests/; else echo 'No tests directory found.'; fi"
  # Artifacts are saved after the build and test for later stages
  artifacts:
    paths:
      - message-service.tar
      - llm-service.tar
      - frontend.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: always

# The 'save_artifacts' job saves the built Docker images as tarballs for transfer and later deployment.
save_artifacts:
  stage: build
  image: docker:24.0-cli
  services:
    - docker:dind
  script:
    # Save Docker images to tarballs for all services
    - docker save -o message-service.tar message-service:test
    - docker save -o llm-service.tar llm-service:test
    - docker save -o frontend.tar frontend:test
  dependencies:
    - container_test
  artifacts:
    paths:
      - message-service.tar
      - llm-service.tar
      - frontend.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: always

# The 'sync_remote' job prepares the remote server and synchronizes all necessary files and artifacts.
sync_remote:
  stage: sync
  image: docker:latest
  script:
    - echo "Syncing files to remote server"
    # Ensure the base directory exists on the remote server
    - ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $(dirname $REMOTE_PATH)"
    # Clean the deployment folder to avoid stale files
    - ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "sudo rm -rf $REMOTE_PATH/*"
    # Copy the infra folder to the remote server
    - rsync -avz -e "ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no" infra/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/infra
    # Ensure service directories exist for .env files
    - ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_PATH/message-service"
    - ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_PATH/llm-service"
    # Copy .env files for both services
    - rsync -avz -e "ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no" message-service/.env $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/message-service/.env
    - rsync -avz -e "ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no" llm-service/.env $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/llm-service/.env
    # Copy Docker image tarballs to the remote server
    - rsync -avz -e "ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no" message-service.tar llm-service.tar frontend.tar $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
  dependencies:
    - save_artifacts
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: always

# The 'deploy_staging' job installs Docker if needed, loads images, and starts containers on the remote server.
deploy_staging:
  stage: deploy
  image: docker:latest
  environment:
    name: staging
    url: https://test.sparabot.com
  script:
    - echo "Deploying to staging server"
    # SSH into the remote server and perform deployment steps
    - |
      ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<EOF
        set -e
        # Install Docker and Compose if not already present
        if ! command -v docker &> /dev/null; then
          echo "Installing Docker and docker compose plugin..."
          sudo apt update
          sudo apt install -y ca-certificates curl gnupg lsb-release
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu \\$(lsb_release -cs) stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt update
          sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        fi
        # Show Docker Compose version for debugging
        docker compose version
        # Load Docker images from tarballs if present
        if [ -f $REMOTE_PATH/message-service.tar ]; then
          sudo docker load -i $REMOTE_PATH/message-service.tar
        fi
        if [ -f $REMOTE_PATH/llm-service.tar ]; then
          sudo docker load -i $REMOTE_PATH/llm-service.tar
        fi
        if [ -f $REMOTE_PATH/frontend.tar ]; then
          sudo docker load -i $REMOTE_PATH/frontend.tar
        fi
        # Change directory to infra for compose up
        cd $REMOTE_PATH/infra
        # Start all services using the test compose file (staging uses test images)
        sudo docker compose -f $COMPOSE_FILE_TEST up -d
      EOF
  dependencies:
    - sync_remote
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: always
