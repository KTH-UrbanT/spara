stages:
  - build
  - test
  - deploy

variables:
  COMPOSE_FILE: infra/docker-compose.test.yml
  REMOTE_USER: ubuntu
  REMOTE_HOST: $STAGING_HOST
  REMOTE_PATH: /home/ubuntu/spara/infra
  SSH_REMOTE_HOST_KEY: $SSH_STAGING_HOST_KEY
  SSH_GITHUB_PRIVATE_KEY: $SSH_MG_PRIVATE_KEY

before_script:
  # install needed CLIs
  - apk add --no-cache git docker-cli docker-compose-plugin openssh-client rsync

  # prepare SSH dir and keys
  - mkdir -p ~/.ssh
  - echo "$SSH_GITHUB_PRIVATE_KEY" > ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - echo "$SSH_REMOTE_HOST_KEY" > ~/.ssh/remote_key
  - chmod 600 ~/.ssh/remote_key

  # trust hosts
  - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts

  # fetch submodules using the GitHub key
  - |
    GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key -o StrictHostKeyChecking=no" \
      git submodule update --init --recursive

  # inject .env files
  - echo "$MESSAGE_SERVICE_ENV" > message-service/.env
  - echo "$LLM_SERVICE_ENV"     > llm-service/.env

container_test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker compose -f $COMPOSE_FILE up -d --build
    - docker compose exec message-service bash -c "PYTHONPATH=/message-service pytest tests/"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: always

deploy_staging:
  stage: deploy
  image: docker:latest
  environment:
    name: staging
    url: https://test.sparabot.com
  script:
    - echo "Deploying to staging server"

    # ensure the remote directory exists
    - ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $(dirname $REMOTE_PATH)"

    # copy the infra/ folder to the remote
    - rsync -avz -e "ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no" infra/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/

    # ssh in (using the remote_key) and restart
    - |
      ssh -i ~/.ssh/remote_key -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST <<-EOF
        cd $REMOTE_PATH

        # check if docker compose is installed, if not, install it
        if ! docker compose version &> /dev/null; then
          echo "'docker compose' not found. Installing docker-compose-plugin..."
          sudo apt update && sudo apt install -y docker-compose-plugin
        fi

        docker compose up -d --build
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^test\//'
      when: always
