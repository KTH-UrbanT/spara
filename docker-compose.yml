services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development # Uses the development stage with npm
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173" # For Vite's dev server
    volumes:
      - ./client:/app # Mounts source code for live updates
      - /app/node_modules # Keeps node_modules from being overwritten
    command: ["npm", "run", "dev"] # Runs Vite in development mode

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@message_store:5432/message_store
      - PYTHONUNBUFFERED=1
    depends_on:
      - message_store
    ports:
      - "8000:8000" # Expose FastAPI on port 8000
    volumes:
      - ./server:/app

  message_store:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: message_store
    ports:
      - "5432:5432"
    volumes:
      - message_store_data:/var/lib/postgresql/data

volumes:
  message_store_data:
